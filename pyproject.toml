[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "act-cli"
version = "0.1.0"
description = "Agent Configuration Toolkit — sync skills and tools from act.toml"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
act = "act.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["act"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
